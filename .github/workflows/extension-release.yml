name: Extension release
# Started by hand on main (Actions, "Extension release", "Run workflow"), or by pushing a tag extension-v<version>:
# the version is the one in extension/manifest.json, and the release creates the tag extension-v<version> on the
# commit it built. Hardened as asked by Cross_Chain's
# audit EXT-06:
#   build    read only, no stored token: packs the zip from the tag, reproducibly, BEFORE any dependency or test
#            tool is installed, and checks it against web/extension/<version>/SHA256SUMS (committed, also served
#            by account.chainintegrate.it);
#   test     read only: the tests, on the same tag, in a separate job that never touches the package;
#   release  the only job that may write: checks the package's SHA-256 again, adds GitHub's build provenance
#            attestation (gh attestation verify) and publishes the release with the SHA-256 in its notes.
# Actions pinned by commit. releases/latest/download/chainintegrate-account.zip always names the latest.
on:
  workflow_dispatch:
  push:
    tags: ["extension-v*"]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: The version, from main or from its tag; the manifest fixes the extension's ID
        id: v
        run: |
          V=$(node -p "require('./extension/manifest.json').version")
          if [ "$GITHUB_REF_TYPE" = tag ]; then test "extension-v$V" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME, manifest $V"; exit 1; }
          else test "$GITHUB_REF" = refs/heads/main || { echo "releases are made from main only"; exit 1; }; fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          node -e "if (!require('./extension/manifest.json').key) { console.error('manifest.json has no key: the extension ID would change'); process.exit(1) }"
      - name: Pack (no dependency installed yet) and check against the committed SHA256SUMS
        run: node tools/pack-extension.js --check
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: package
          path: dist/
          if-no-files-found: error
  test:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: npm run test:unit
      - run: npm run test:extension
  release:
    needs: [build, test]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: package
          path: dist
      - name: The package is still the one built
        run: cd dist && sha256sum -c --ignore-missing SHA256SUMS && grep -q '  chainintegrate-account.zip$' SHA256SUMS
      - uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-path: dist/chainintegrate-account.zip
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
          V: ${{ needs.build.outputs.version }}
        run: |
          gh release view "extension-v$V" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 && { echo "extension-v$V is already released: a new version is needed"; exit 1; }
          sha=$(sha256sum dist/chainintegrate-account.zip | cut -d' ' -f1)
          cat > notes.txt <<NOTES
          ChainIntegrate Account $V

          SHA-256 of chainintegrate-account.zip: $sha
          The same list of SHA-256 (the zip and every file in it) is SHA256SUMS below and at
          https://account.chainintegrate.it/extension/$V/SHA256SUMS (ChainIntegrate's own site).
          Provenance: gh attestation verify chainintegrate-account.zip --repo $GITHUB_REPOSITORY
          Rebuild: git checkout extension-v$V && node tools/pack-extension.js --check

          Install: unzip into a folder that is not synced (Windows: %LOCALAPPDATA%\ChainIntegrate, Mac:
          ~/Library/Application Support/ChainIntegrate), then chrome://extensions, Developer mode,
          "Load unpacked", the chainintegrate-account folder. Update: unzip over the same folder, then "Reload".
          NOTES
          sed -i 's/^          //' notes.txt
          gh release create "extension-v$V" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "ChainIntegrate Account $V" --notes-file notes.txt \
            dist/chainintegrate-account.zip "dist/chainintegrate-account-$V.zip" dist/SHA256SUMS
