# Response headers of account.chainintegrate.it (nginx): /etc/nginx/snippets/account-security-headers.conf.
# Included in the server block and again in every location with its own add_header (nginx drops the
# server-level headers there). The pages are never framed; scripts only from the site and ethers from cdnjs
# (the pages also carry their own <meta> policy, the browser applies both).
# connect-src: the client's page connects to nothing; the operator's page reads LUKSO's RPCs and uploads to
# Pinata (location /operator.html sets that wider policy).
add_header X-Frame-Options "DENY" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://cdnjs.cloudflare.com/ajax/libs/ethers/6.13.4/; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'none'; worker-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "no-referrer" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
