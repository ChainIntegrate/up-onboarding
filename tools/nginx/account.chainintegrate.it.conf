# account.chainintegrate.it: the client's page (index.html) and the operator's (operator.html).
# /etc/nginx/sites-available/account.chainintegrate.it, linked in sites-enabled. The web root is the web/
# folder of a clone of ChainIntegrate/up-onboarding, so nothing else in the repository is served.
# The certificate comes first, from the port 80 block alone (DEPLOY.md); its renewal uses the same path.

server {
    listen 80;
    listen [::]:80;
    server_name account.chainintegrate.it;
    location ^~ /.well-known/acme-challenge/ { root /var/www/up-onboarding/web; }
    location / { return 301 https://$host$request_uri; }
}

server {
    # "listen … ssl http2" works on nginx 1.24 (Ubuntu 24.04) and later; from 1.25.1, "http2 on;" is the new form.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name account.chainintegrate.it;

    ssl_certificate     /etc/letsencrypt/live/account.chainintegrate.it/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/account.chainintegrate.it/privkey.pem;

    root /var/www/up-onboarding/web;
    index index.html;
    charset utf-8;
    server_tokens off;

    include /etc/nginx/snippets/account-security-headers.conf;
    add_header Strict-Transport-Security "max-age=31536000" always;

    # Dot files and folders: never served.
    location ~ /\. { return 404; }

    # The pages and their scripts: always checked again, so a fix reaches every client at once.
    location ~ \.(html|js)$ {
        include /etc/nginx/snippets/account-security-headers.conf;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    # The operator's page reads LUKSO's RPCs and uploads to Pinata: a wider connect-src for it only.
    location = /operator.html {
        add_header X-Frame-Options "DENY" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://cdnjs.cloudflare.com/ajax/libs/ethers/6.13.4/; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src https://rpc.mainnet.lukso.network https://rpc.testnet.lukso.network https://api.pinata.cloud; worker-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header Cache-Control "no-cache" always;
        add_header X-Robots-Tag "noindex" always;
        try_files $uri =404;
    }

    location / { try_files $uri $uri/ =404; }
}
