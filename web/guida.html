<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="script-src 'self'">
<script src="lib/theme.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>Guida all'account ChainIntegrate</title>
<meta name="description" content="Come installare l'estensione ChainIntegrate Account, creare l'account, fare la copia di backup, usare l'account sui siti di ChainIntegrate e aggiungere un altro computer.">
<link rel="icon" href="favicon.ico">
<link rel="apple-touch-icon" href="icon-192.png">
<script src="lib/ui.js"></script>
<style>
  /* ChainIntegrate's look (as index.html); the dark theme is in lib/theme.js. */
  :root {
    --bg: #f7f7f7; --panel: #ffffff; --border: #dde3e6; --field: #fbfcfc; --chip: #e8eef1;
    --text: #1b1e21; --text-dim: #5b6b74;
    --brand: #22b8c9; --slate: #6090a2; --accent: #0e7f8c; --btn: #0e7f8c;
    --ok: #1a8a4a; --warn: #a8650a; --err: #c93535;
    color-scheme: light;
  }
  * { box-sizing: border-box; }
  body { background: var(--bg); color: var(--text); font-family: -apple-system, "Segoe UI", Roboto, sans-serif; max-width: 820px; margin: 0 auto; padding: 32px 20px 80px; line-height: 1.6; }
  .brand-row { margin-bottom: 24px; padding-bottom: 16px; border-bottom: 3px solid var(--brand); }
  .brand-logo { display: block; height: 72px; width: auto; max-width: 100%; border-radius: 10px; background: #f7f7f7; }
  .header-row { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; }
  h1 { font-size: 22px; margin: 0 0 4px; line-height: 1.3; }
  .subtitle { color: var(--text-dim); font-size: 14px; margin-bottom: 24px; }
  #langToggle { width: auto; background: var(--chip); padding: 8px 14px; font-size: 12.5px; font-weight: 600; border-radius: 6px; border: 1px solid var(--border); color: var(--text); cursor: pointer; margin-top: 2px; flex-shrink: 0; }
  .panel { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 20px 22px; margin-bottom: 18px; overflow-wrap: anywhere; }
  .panel h2 { font-size: 17px; margin: 0 0 10px; color: var(--accent); scroll-margin-top: 16px; }
  .panel p, .panel li { font-size: 14.5px; }
  .panel ol, .panel ul { padding-left: 22px; margin: 8px 0; }
  .panel li + li { margin-top: 6px; }
  .btn { display: inline-block; background: var(--chip); border: 1px solid var(--border); border-radius: 5px; padding: 0 6px; font-size: 13.5px; font-weight: 600; white-space: normal; }
  .tip { border-left: 4px solid var(--brand); background: var(--field); padding: 10px 14px; border-radius: 6px; font-size: 14px; margin: 10px 0; }
  .warn { border-left: 4px solid var(--err); background: var(--field); padding: 10px 14px; border-radius: 6px; font-size: 14px; margin: 10px 0; }
  .toc ol { columns: 2; column-gap: 28px; padding-left: 20px; } .toc li { break-inside: avoid; margin: 0 0 6px; font-size: 14px; }
  @media (max-width: 600px) { .toc ol { columns: 1; } }
  a { color: var(--accent); font-weight: 600; }
  .site-footer { margin-top: 40px; padding: 18px 20px; background: #f7f7f7; border: 1px solid #dde3e6; border-radius: 10px; color: #4b4f58; font-size: 13px; }
  .site-footer a { color: #0e7f8c; text-decoration: none; font-weight: 600; }
</style>
</head>
<body>
<div class="brand-row"><a href="./"><img src="logo.png" alt="ChainIntegrate" class="brand-logo" width="830" height="240"></a></div>
<div class="header-row">
  <div>
    <h1 data-i18n="h1">Guida all'account ChainIntegrate</h1>
    <div class="subtitle" data-i18n="subtitle"></div>
  </div>
  <button id="langToggle" type="button">English</button>
</div>

<div class="panel toc"><h2 data-i18n="tocTitle">In questa guida</h2><ol id="toc"></ol></div>
<div id="sections"></div>

<div class="site-footer" data-i18n-html="footerHtml"></div>
<script src="guida.js"></script>
</body>
</html>
